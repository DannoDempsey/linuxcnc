[EMC]
VERSION = 1.1
MACHINE = Lathezy-PRO
DEBUG = 0x7FFFFFFF


[DISPLAY]
DISPLAY = gscreen -c lathezy -d
EDITOR = gedit
LATHE = 1

# Lathezy has the following increments available based on G20/G21 being active
#INCREMENTS 0.1 mm, 0.01 mm, 0.001 mm, 0.1 inch, 0.01 inch, 0.001 inch, 0.0001 inch

# time that display will sleep between polls ms
CYCLE_TIME = 100

POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL

# The folowing items are read by the gui, should be the same values as the 
# [AXIS]/[JOINT] section values for  
# set the initial jog rate, should be = MAX_LINEAR_VELOCITY * 0.6
#MAX_LINEAR_VELOCITY = 165.0
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY = 85
MAX_FEED_OVERRIDE = 2.0
MAX_SPINDLE_OVERRIDE = 1.2
MIN_SPINDLE_OVERRIDE = 0.50
MAX_RAPID_OVERRIDE = 1.0

# gscreen preference file (hidden) location
#PREFERENCE_FILE_PATH = ~/.gscreen_preferences
PREFERENCE_FILE_PATH = /home/daniel/.gscreen_preferences

# default directory for gcode files and user-defined M-codes 
# 2.7 directory home/daniel/linuxcnc/nc_files
#PROGRAM_PREFIX = ../../linuxcnc/nc_files
# or 
# 2.8 rip directory = home/souces/linuxcnc-dev/nc_files
#PROGRAM_PREFIX = home/sources/linuxcnc-dev/nc_files
PROGRAM_PREFIX = ../../

# items required for embeded NGCgui 
# pyngcgui.ui must be located in the same folder as the .ini file
EMBED_TAB_NAME = NCG
EMBED_TAB_LOCATION = embed_tab2_vbox
EMBED_TAB_COMMAND = gladevcp  -x {XID} pyngcgui.ui

NGCGUI_FONT = Helvetica -16 normal 
# list of subroutines that the gui should be populated with
# currently populated in the config/lathe-ui dir
NGCGUI_PREAMBLE     = lathe_std.ngc
#NGCGUI_SUBFILE     = id-turn-inch.ngc
NGCGUI_SUBFILE      = x-universal.ngc
NGCGUI_SUBFILE      = x-od-taper.ngc
NGCGUI_SUBFILE      = x-id-taper.ngc
# specify "" for a custom tab page
#NGCGUI_SUBFILE       = ""
# This is critical for lathes, albeit somewhat dangerous since the 
# machine will be in whatever state it was in when the subroutine 
# is finished
NGCGUI_OPTIONS = nom2
# if you press the 'tooleditor' button then this program will be launched
# leave it commented out if you prefer Gscreens tooleditor.
#TOOL_EDITOR = tooledit

INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 2

[FILTER]

PROGRAM_EXTENSION = .py Python Script
PROGRAM_EXTENSION = .ngc G-code files
PROGRAM_EXTENSION = .png,.gif,.jpg Grayscale Depth Image
png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python
 
[RS274NGC]
RS274NGC_STARTUP_CODE = G18 G21 G90 G95 F0.1 G97 S1000
# lathe-macro (.ngc) files located:    /home/sources/linuxcnc-dev/lathezy/lathemacro-library
# ngcgui (.ngc) files located:        /home/sources/linuxcnc-dev/lathezy/ngcgui-library
# ngcgui (.ngc) files are xxxx_type2.ngc
# NOTE: the first matching sub-routine file found in the search list is used. Format = dir-path:dir-path:
# These directories are searched after [DISPLAY] PROGRAM_PREFIX
# ../ = search parent directory
# ./  = search currrent directory

SUBROUTINE_PATH = ./remap-library:./python:./lathemacro-library:./ngcgui-library:../../nc_files
# This machine has a lot of user m-codes, so we want to keep them all in the same place and not available to other configs. See the README file for descriptions of custom m-codes
USER_M_PATH = ./mcodes:./

#turn on all features except retain G43
#allows interpreter to look inside .ini file for variables see [MOTION_OUT] and [MOTION_IN]
FEATURES = 30

#Use Fanuc style tool change
REMAP=T prolog=get_T_number ngc=fanuc2_toolchange 

# M28 OPEN CHUCK
REMAP=M28 ngc=m28 modalgroup=10

# M29 CLOSE CHUCK
REMAP=M29 ngc=m29 modalgroup=10


# M31 TAIL STOCK FORWARD
REMAP=M31 ngc=m31   epilog=m31_epilog   modalgroup=10

# M32 TAIL STOCK REVERSE
REMAP=M32 ngc=m32   epilog=m32_epilog   modalgroup=10

# M36 HYD.SHIFT NEUTRAL
REMAP=M36   prolog=gear_shift_prolog ngc=m36 epilog=m36_epilog modalgroup=10 

# M37 HYD.SHIFT LOW
REMAP=M37   prolog=gear_shift_prolog ngc=m37 epilog=m37_epilog  modalgroup=10

# M39 HYD.SHIFT HIGH 
REMAP=M39   prolog=gear_shift_prolog ngc=m39 epilog=m39_epilog  modalgroup=10


# M-Codes used for axis homing routines
# X-Axis 
REMAP=M200 ngc=m200     modalgroup=10
REMAP=M201 ngc=m201     modalgroup=10
REMAP=M202 ngc=m202     modalgroup=10
REMAP=M203 ngc=m203     modalgroup=10   
REMAP=M204 ngc=m204     modalgroup=10
REMAP=M205 ngc=m205     modalgroup=10
#REMAP=M206 Reserved
#REMAP=M207 Reserved
#REMAP=M208 Reserved 
#REMAP=M209 Reserved

#Z-Axis
REMAP=M210 ngc=m210     modalgroup=10
REMAP=M211 ngc=m211     modalgroup=10
REMAP=M212 ngc=m212     modalgroup=10
REMAP=M213 ngc=m213     modalgroup=10   
REMAP=M214 ngc=m214     modalgroup=10
REMAP=M215 ngc=m215     modalgroup=10
#REMAP=M216 Reserved
#REMAP=M217 Reserved
#REMAP=M218 Reserved 
#REMAP=M219 Reserved

# HSSC Harmonic Spindle Speed Control
# P = period, Q = qmplitude R = interval, adding the ^ character means spindle must be running
REMAP=M600 argspec=PQR python=M600_remap modalgroup=10  
REMAP=M601 python=M601_remap modalgroup=10

# this is important - read common_nc_subs/reset_state.ngc
ON_ABORT_COMMAND=O <on_abort> call 

PARAMETER_FILE = /home/daniel/linuxcnc-dev/configs/lathezy-pro3/sltbed.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT =       10.0
BASE_PERIOD =   500000
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[HAL]
HALFILE = lathezy-pro3.hal
HALFILE = lathezy-pro3-io.hal
HALFILE = lathezy-pro3-axis.hal
HALFILE = lathezy-pro3-spindle.hal

POSTGUI_HALFILE = lathezy-pro3-postgui.hal

HALUI = halui

[HALUI]
# Nothing at this time

[TRAJ]
COORDINATES = XZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
SPINDLES = 1

# Intial rate for jogs of linear axis machine units/min
DEFAULT_LINEAR_VELOCITY = 85.00

# Max Velocity for any co-ordinated move (machine units/sec)
MAX_LINEAR_VELOCITY = 85.00

# Acceleration (machine units/sec^2)
MAX_LINEAR_ACCELERATION = 500.00

# The new trajectory palnner (TP) is on by default
ARC_BLEND_ENABLE = 1
ARC_BLEND_FALLBACK_ENABLE = 0
ARC_BLEND_OPTIMIZATION_DEPTH = 50
ARC_BLEND_GAP_CYCLES = 4
ARC_BLEND_RAMP_FREQ = 100

# Number of spindles
SPINDLES = 1

#POSITION_FILE = position.txt

# 
NO_FORCE_HOMING = 1


[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = lathe-fanucy.tbl
TOOL_CHANGE_WITH_SPINDLE_ON = 1

[KINS]
KINEMATICS = trivkins coordinates=xz
JOINTS = 2

# 12-Dec-2021 Set maximum velocity = 5000mm/min = 83.333 mm/min

[AXIS_X]
MIN_LIMIT =  -400.000
MAX_LIMIT =  5.000
MAX_VELOCITY =  85.00
MAX_ACCELERATION = 500.00
[AXIS_Z]
MIN_LIMIT = -1000.000
MAX_LIMIT = 5.000
MAX_VELOCITY =  85.00
MAX_ACCELERATION = 500.00

[JOINT_0]
TYPE = LINEAR
MAX_VELOCITY =  85.00
MAX_ACCELERATION =  500.00
MIN_LIMIT = -400.000
MAX_LIMIT = 5.000
#FERROR = 0.1

# Use the internal homing routine of the amplifiers by specifiying 
# HOME_AUTO = 1, HOME_SEARCH_VEL != 0.0, & HOME_LATCH_VEL != 0.0
HOME            = 0.000
HOME_SEQUENCE   = 0
HOME_SEARCH_VEL = 25.0
HOME_LATCH_VEL  = 10.0
# Used with auto homing routine of ethercat amps.
HOME_AUTO   = 1
# Not used any more in handler gui. Can probably delete
HOME_TIMEOUT    = 60.0 



[JOINT_1]
TYPE = LINEAR
MAX_VELOCITY =   85.00
MAX_ACCELERATION =  500.00
MIN_LIMIT =  -1000.000
MAX_LIMIT =  5.000
#FERROR = 1000.0
HOME_SEARCH_VEL =   25.0
HOME_LATCH_VEL =   10.0
HOME_SEQUENCE =   1
HOME = 0.000
HOME_AUTO = 1
# Not used any more in handler gui. Can probably delete
HOME_TIMEOUT = 60.0


[PYTHON]
# where to find Python code
# code specific for this configuration 
PATH_PREPEND= /home/daniel/linuxcnc-dev/configs/lathezy-pro3/python

# import the following Python module
TOPLEVEL = /home/daniel/linuxcnc-dev/configs/lathezy-pro3/python/toplevel.py

# generic support code (remap.py, stdglue.py ?)
PATH_APPEND = /home/daniel/linuxcnc-dev/nc_files/remap_lib/python-stdglue

# the higher the more verbose tracing of the Python plugin
LOG_LEVEL = 5


# user specific sections
[SPINDLE]
MAX_RPM = 4000
MIN_RPM = 20
SCALE = 1.0

########################################################################
# Motion Digital I/O for M-CODE  procedures
########################################################################

#[MOTION_IN]
# Gear shift Inputs
#LSW1 = 00
#LSW3 = 01
#LSW4 = 02




########################################################################
# MOTION DIGITAL INPUTS
########################################################################
[MOTION_IN]

# LSW-1 Neutral 
LSW1 = 00

# LSW-3 Low
LSW3 = 01

# LSW-4 High
LSW4 = 02

# LSW-5 Tailstock Unclamp
LSW5 = 03

# LSW-8 Tailstock FWD end
LSW8 = 04

# LSW-9 Tailstock REV end 
LSW9 = 05

# LSW-10 Tailsleeve FWD end
LSW10 = 06

# LSW-11 Tailsleeve REV end
LSW11 = 07

M31_STEP1_DONE = 08
M31_STEP2_DONE = 09
M32_STEP1_DONE = 10
M32_STEP2_DONE = 11
M31_DONE = 31
M32_DONE = 32
M33_DONE = 33
M34_DONE = 34
M36_DONE = 36
M37_DONE = 37
M39_DONE = 39

# MOTION DIGITAL OUTPUTS ###############################################
# SOL_1   Turret Unclamp;       handled in classicladder
# SOL_2A  Turret Rotation;      handled in classicladder
# SOL_2B  Turret Slow Rotation; handled in classicladder
# SOL-20A Hydraulic Shift Low; 
# SOL-20B Hydraulic Shift High; 
# SOL-22A Tailstock Forward;
# SOL-22B Tailstock Reverse;
# SOL-23  Tailstock Unclamp;
# SOL-XXX Tailsleeve Forward; QF in logic diagram
# SOL-XXX Tailsleeve Reverse; QR in logic diagram 
# INCHING Gear Change
# XMP_0  X-Amplifier Mode Pin 0, etc
# ZMP_0  Z-Amplifier Mope Pin 0, etc
########################################################################

[MOTION_OUT]
# Servo Mode Pins
XMP_0 = 0
XMP_1 = 1
XMP_2 = 2
XMP_3 = 3
XMP_4 = 4
XMP_5 = 5
XMP_6 = 6
XMP_7 = 7

ZMP_0 = 8
ZMP_1 = 9
ZMP_2 = 10
ZMP_3 = 11
ZMP_4 = 12
ZMP_5 = 13
ZMP_6 = 14
ZMP_7 = 15

# Pin 16 RESERVED

# SOL-20A Hydraulic Shift Low; 
SOL_20A = 17

# SOL-20B Hydraulic Shift High; 
SOL_20B = 18

# SOL-22A Tailstock Forward;
SOL_22A = 19

# SOL-22B Tailstock Reverse;
SOL_22B = 20

# SOL-23  Tailstock Unclamp;
SOL_23 = 21

# Tailstock M-codes
M31_STEP1 = 22
M31_STEP2 = 23
M32_STEP1 = 24
M32_STEP2 = 25

# Inching solenoid to help with gear shift, No longer used.
INCHING = 30

M31_START = 31
M32_START = 32
M33_START = 33
M34_START = 34
M36_START = 36
M37_START = 37
M39_START = 39

X_INHIBIT = 40
Z_INHIBIT = 41
SHIFT_REQUEST = 42

CHUCK_OPEN = 45

[DWELL]
TAILSTOCK_UNCLAMP = 1 
X_BRAKE_DELAY = 2.0
Z_BRAKE_DELAY = 2.0
SPINDLE_DELAY = 5.0
SHIFT_DELAY = 1.0
CHUCK_DWELL = 3.0


